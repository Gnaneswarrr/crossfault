[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crossfault"
version = "0.1.0"
description = "Bounded simulator for reconstructing network-induced deployment failures"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "google-genai>=0.2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
